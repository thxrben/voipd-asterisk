; Every call goes straight into voipd's Stasis app. Do not add logic here.
; Patterns deliberately do not match the special "h" extension, otherwise a
; hangup in dialplan would re-enter Stasis.
[general]
static = yes
writeprotect = yes

[from-trunk]
exten => _[+0-9*#].,1,Stasis(${VOIPD_ARI_APP},inbound)
 same => n,Hangup()
exten => s,1,Stasis(${VOIPD_ARI_APP},inbound)
 same => n,Hangup()

[from-internal]
exten => _[+0-9*#].,1,Stasis(${VOIPD_ARI_APP},internal)
 same => n,Hangup()
