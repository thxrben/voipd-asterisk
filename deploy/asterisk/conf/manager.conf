[general]
enabled = yes
bindaddr = 127.0.0.1
port = 5038

[${VOIPD_AMI_USER}]
secret = ${VOIPD_AMI_PASSWORD}
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
; system: registry/contact status, reporting: RTCP stats,
; security: failed logins (voipd bans the sender after repeated failures)
read = system,call,reporting,dtmf,command,security
write = system,call,command,originate,reporting
