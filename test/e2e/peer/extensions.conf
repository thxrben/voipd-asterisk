[general]
static = yes

; Calls arriving from the PBX: to a phone (request user = contact user) or
; to the "carrier" (outbound calls, request user = dialed number).
[from-pbx]
exten => phone10,1,Set(PHONE=phone10)
 same => n,Goto(phone,s,1)
exten => phone11,1,Set(PHONE=phone11)
 same => n,Goto(phone,s,1)
exten => _+X.,1,Set(DB(test/last_outbound)=${EXTEN})
 same => n,Ringing()
 same => n,Wait(1)
 same => n,Answer()
 same => n,Playtones(425/1000)
 same => n,Wait(${DB(test/outbound_talk)})
 same => n,Hangup()

; Phone behaviour is controlled per test via AstDB test/<phone>:
;   answer:<s>  ring for s seconds then answer, talk test/talk seconds
;   busy        reject with 486
;   ring        ring forever
[phone]
exten => s,1,Set(MODE=${DB(test/${PHONE})})
 same => n,Set(MODE=${IF($["${MODE}" = ""]?ring:${MODE})})
 same => n,Set(DB(test/${PHONE}_callerid)=${CALLERID(num)})
 same => n,GotoIf($["${MODE}" = "busy"]?busy)
 same => n,Ringing()
 same => n,GotoIf($["${MODE}" = "ring"]?ring)
 same => n,Wait(${CUT(MODE,:,2)})
 same => n,Answer()
 same => n,Playtones(440/1000)
 same => n,Wait(${DB(test/talk)})
 same => n,Hangup()
 same => n(busy),Busy(10)
 same => n(ring),Wait(300)

; The carrier's side of an inbound call: send audio until hung up.
[carrier-talk]
exten => s,1,Playtones(350/1000)
 same => n,Wait(30)

; Originated by the test: carrier calls one of the PBX's numbers (test/did,
; default +492011111111), using exactly that number's registration.
[carrier-out]
exten => call,1,Set(CALLERID(num)=${DB(test/callerid)})
 same => n,Set(DID=${DB(test/did)})
 same => n,Set(DID=${IF($["${DID}" = ""]?+492011111111:${DID})})
 same => n,Dial(${PJSIP_DIAL_CONTACTS(pbx,${DID})},60)

; Originated by the test: phone 10 dials a number through the PBX.
[phone-out]
exten => _X.,1,Dial(PJSIP/${EXTEN}@phone10,60)
exten => _0X.,1,Dial(PJSIP/${EXTEN}@phone10,60)
