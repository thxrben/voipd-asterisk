; Test peer: plays the carrier (our trunk registers here) and two phones
; (registering to the PBX as extensions 10 and 11). "pbx" resolves to the
; docker host, where the PBX runs with host networking.
[global]
type = global
endpoint_identifier_order = ip,username

[udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; Everything the PBX sends us (trunk REGISTER, inbound calls to phones,
; outbound calls to the "carrier") is identified by source IP.
[pbx]
type = endpoint
context = from-pbx
disallow = all
allow = g722,alaw
aors = +492011111111,+492012222222
direct_media = no
rtp_symmetric = yes
; Chaos tests write "auth = carrier-auth" / "auth = carrier-wrong" here to
; make the carrier challenge (and reject) our registration.
#tryinclude pbx_auth.conf

[+492011111111]
type = aor
max_contacts = 1
remove_existing = yes
minimum_expiration = 10

; Second number (MSN) on the same line, registered separately.
[+492012222222]
type = aor
max_contacts = 1
remove_existing = yes
minimum_expiration = 10

[carrier-auth]
type = auth
auth_type = userpass
username = u1
password = p1

[carrier-wrong]
type = auth
auth_type = userpass
username = u1
password = definitely-not-p1

[pbx]
type = identify
endpoint = pbx
match = pbx

; Phones: endpoints used to call *into* the PBX, plus their registrations.
[phone-auth](!)
type = auth
auth_type = userpass

[phone10-auth](phone-auth)
username = kitchen
password = kitchen-pw

[phone11-auth](phone-auth)
username = office
password = office-pw

[phone10]
type = registration
server_uri = sip:pbx:5060
client_uri = sip:kitchen@pbx
contact_user = phone10
outbound_auth = phone10-auth
; Keep retrying like real phones do (the PBX may not know us yet).
retry_interval = 3
forbidden_retry_interval = 3
fatal_retry_interval = 3
auth_rejection_permanent = no
max_retries = 1000
expiration = 120

[phone11]
type = registration
server_uri = sip:pbx:5060
client_uri = sip:office@pbx
contact_user = phone11
outbound_auth = phone11-auth
; Keep retrying like real phones do (the PBX may not know us yet).
retry_interval = 3
forbidden_retry_interval = 3
fatal_retry_interval = 3
auth_rejection_permanent = no
max_retries = 1000
expiration = 120

[phone10]
type = aor
contact = sip:pbx:5060

[phone11]
type = aor
contact = sip:pbx:5060

[phone10]
type = endpoint
context = from-pbx
disallow = all
allow = g722,alaw
outbound_auth = phone10-auth
aors = phone10
from_user = kitchen
direct_media = no

[phone11]
type = endpoint
context = from-pbx
disallow = all
allow = alaw
outbound_auth = phone11-auth
aors = phone11
from_user = office
direct_media = no

; Security tests write a misbehaving phone (wrong password) here.
#tryinclude intruder.conf
